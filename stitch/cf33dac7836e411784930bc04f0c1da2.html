<style>
        .glitch-bg {
            background-image: radial-gradient(circle at 50% 50%, rgba(0, 219, 231, 0.05) 0%, transparent 70%),
                              linear-gradient(0deg, rgba(13, 21, 21, 1) 0%, rgba(13, 21, 21, 0.8) 100%);
        }
        
        .scanlines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.1) 50%, rgba(0,0,0,0.1));
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 10;
        }

        .neon-border {
            border: 1px solid rgba(0, 219, 231, 0.3);
            box-shadow: inset 0 0 10px rgba(0, 219, 231, 0.1);
        }

        .neon-bloom-active {
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.4), inset 0 0 10px rgba(0, 242, 255, 0.2);
        }
        
        .magenta-bloom {
             box-shadow: 0 0 20px rgba(255, 36, 228, 0.4), inset 0 0 10px rgba(255, 36, 228, 0.2);
        }

        .hud-chip {
            border: 1px solid rgba(0, 219, 231, 0.3);
            background: rgba(0, 219, 231, 0.05);
            backdrop-filter: blur(12px);
        }
        
        .grid-perspective {
            transform: perspective(1000px) rotateX(60deg);
            transform-origin: bottom center;
        }
        
        .pulse-rail {
            background: linear-gradient(90deg, transparent, rgba(0, 219, 231, 0.8), transparent);
            background-size: 200% 100%;
            animation: pulse-move 2s linear infinite;
        }
        
        @keyframes pulse-move {
            0% { background-position: 100% 0; }
            100% { background-position: -100% 0; }
        }
    </style>
</head>
<body class="bg-background text-on-surface h-screen w-screen overflow-hidden glitch-bg font-body-md">
<div class="scanlines"></div>
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-margin-mobile md:px-margin-desktop h-16 bg-surface/80 backdrop-blur-xl border-b border-primary/20 shadow-[0_4px_30px_rgba(0,219,231,0.1)]">
<div class="font-display-lg-mobile text-display-lg-mobile md:font-display-lg md:text-display-lg italic text-primary drop-shadow-[0_0_10px_rgba(225,253,255,0.8)]">PulseRail Lite</div>
<!-- Trailing Icons -->
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-primary hover:bg-primary/20 hover:text-primary transition-all duration-300 p-2 rounded-DEFAULT cursor-pointer">sports_esports</span>
<span class="material-symbols-outlined text-on-surface-variant hover:bg-primary/20 hover:text-primary transition-all duration-300 p-2 rounded-DEFAULT cursor-pointer">favorite</span>
<span class="material-symbols-outlined text-on-surface-variant hover:bg-primary/20 hover:text-primary transition-all duration-300 p-2 rounded-DEFAULT cursor-pointer">bolt</span>
</div>
</header>
<!-- SideNavBar (Hidden on Mobile) -->
<nav class="fixed left-0 top-0 h-full z-40 hidden md:flex flex-col py-20 bg-surface-dim/90 backdrop-blur-2xl docked left-0 h-full w-20 md:w-64 border-r border-secondary/20 shadow-[-10px_0_30px_rgba(255,36,228,0.1)]">
<!-- Header -->
<div class="px-6 mb-8 flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-secondary-container/20 flex items-center justify-center border border-secondary/30">
<span class="material-symbols-outlined text-secondary">account_circle</span>
</div>
<div class="hidden md:block">
<div class="font-headline-md text-headline-md text-secondary-container">OPERATOR_01</div>
<div class="font-label-caps text-label-caps text-secondary opacity-80">LVL 42 SYNC</div>
</div>
</div>
<!-- Navigation Links -->
<div class="flex-1 flex flex-col gap-2 w-full">
<a class="text-on-surface-variant p-4 flex items-center gap-4 opacity-60 hover:bg-secondary/10 hover:opacity-100 transition-opacity w-full" href="#">
<span class="material-symbols-outlined">bolt</span>
<span class="hidden md:block font-label-caps text-label-caps">Energy</span>
</a>
<a class="bg-secondary-container/20 text-secondary border-r-4 border-secondary p-4 flex items-center gap-4 w-full translate-x-1 duration-150" href="#">
<span class="material-symbols-outlined">grid_view</span>
<span class="hidden md:block font-label-caps text-label-caps">Grid</span>
</a>
<a class="text-on-surface-variant p-4 flex items-center gap-4 opacity-60 hover:bg-secondary/10 hover:opacity-100 transition-opacity w-full" href="#">
<span class="material-symbols-outlined">sync</span>
<span class="hidden md:block font-label-caps text-label-caps">Sync</span>
</a>
<a class="text-on-surface-variant p-4 flex items-center gap-4 opacity-60 hover:bg-secondary/10 hover:opacity-100 transition-opacity w-full" href="#">
<span class="material-symbols-outlined">settings_input_component</span>
<span class="hidden md:block font-label-caps text-label-caps">Pulse</span>
</a>
</div>
<div class="mt-auto px-4 w-full">
<button class="w-full bg-secondary-container/10 border border-secondary/50 text-secondary font-label-caps text-label-caps py-3 px-4 hover:bg-secondary hover:text-on-secondary transition-colors uppercase tracking-widest">
                OVERDRIVE
            </button>
</div>
</nav>
<!-- Main Canvas -->
<main class="relative w-full h-full pt-16 md:pl-64 flex flex-col z-20">
<!-- HUD Layer -->
<div class="absolute top-20 left-0 w-full px-margin-mobile md:px-margin-desktop flex justify-between items-start pointer-events-none z-30">
<!-- Top Left Stats -->
<div class="flex flex-col gap-2">
<div class="hud-chip px-4 py-2 font-label-caps text-label-caps text-primary flex items-center gap-2">
<span class="opacity-70">SCORE:</span>
<span class="font-bold text-[16px]">12,450</span>
</div>
<div class="hud-chip px-4 py-2 font-label-caps text-label-caps text-secondary flex items-center gap-2 w-max">
<span class="opacity-70">COMBO:</span>
<span class="font-bold">x5</span>
</div>
</div>
<!-- Top Right Stats -->
<div class="flex flex-col gap-2 items-end">
<div class="hud-chip px-4 py-2 font-label-caps text-label-caps text-primary flex items-center gap-2">
<span class="opacity-70">LEVEL:</span>
<span class="font-bold">04</span>
</div>
<div class="flex gap-1 mt-1">
<span class="material-symbols-outlined text-secondary" style="font-variation-settings: 'FILL' 1;">favorite</span>
<span class="material-symbols-outlined text-secondary" style="font-variation-settings: 'FILL' 1;">favorite</span>
<span class="material-symbols-outlined text-secondary" style="font-variation-settings: 'FILL' 1;">favorite</span>
</div>
</div>
</div>
<!-- Gameplay Area (3D Grid) -->
<div class="flex-1 relative w-full h-full overflow-hidden flex items-center justify-center perspective-container">
<!-- The 3D Grid -->
<div class="w-[200%] h-[200%] absolute bottom-[-50%] left-[-50%] grid-perspective pointer-events-none border-t border-primary/20">
<!-- Grid Lines -->
<div class="absolute inset-0 bg-[linear-gradient(rgba(0,219,231,0.1)_1px,transparent_1px),linear-gradient(90deg,rgba(0,219,231,0.1)_1px,transparent_1px)] bg-[size:50px_50px]"></div>
<!-- Rails and Pulses -->
<div class="absolute top-1/2 left-1/4 w-1/2 h-[2px] bg-primary/20 rotate-45 transform origin-left">
<div class="w-full h-full pulse-rail"></div>
</div>
<div class="absolute top-1/3 left-1/2 w-1/3 h-[2px] bg-primary/20 -rotate-12 transform origin-left">
<div class="w-full h-full pulse-rail" style="animation-delay: 0.5s; background: linear-gradient(90deg, transparent, rgba(0, 242, 255, 0.9), transparent);"></div>
</div>
<!-- Overload Zone (Magenta) -->
<div class="absolute top-[40%] left-[60%] w-32 h-32 border border-secondary/50 rounded-full magenta-bloom bg-secondary/5 flex items-center justify-center">
<div class="w-16 h-16 border border-secondary rounded-full animate-ping opacity-50"></div>
</div>
</div>
<!-- Floating Action Overlay (Start/Restart) - Active State -->
<div class="z-40 flex flex-col items-center gap-6 p-8 bg-surface-dim/80 backdrop-blur-md border border-primary/30 rounded-lg neon-bloom-active relative pointer-events-auto shadow-2xl">
<div class="absolute inset-0 bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0IiBoZWlnaHQ9IjQiPgo8cmVjdCB3aWR0aD0iNCIgaGVpZ2h0PSI0IiBmaWxsPSJub25lIi8+CjxyZWN0IHdpZHRoPSIxIiBoZWlnaHQ9IjEiIGZpbGw9InJnYmEoMCwgMjE5LCAyMzEsIDAuMSkiLz4KPC9zdmc+')] opacity-50 rounded-lg pointer-events-none"></div>
<h2 class="font-headline-md text-headline-md text-primary tracking-[0.1em] text-center drop-shadow-[0_0_8px_rgba(0,219,231,0.8)]">SYSTEM READY</h2>
<div class="flex flex-col gap-4 w-full min-w-[200px]">
<button class="w-full py-4 border border-primary text-primary font-label-caps text-label-caps uppercase hover:bg-primary hover:text-on-primary transition-all duration-300 hover:shadow-[0_0_20px_rgba(0,242,255,0.6)] relative group overflow-hidden">
<span class="relative z-10">Start Game</span>
<div class="absolute inset-0 bg-primary/20 translate-x-[-100%] group-hover:translate-x-0 transition-transform duration-300 ease-out"></div>
</button>
<button class="w-full py-3 border border-outline-variant text-on-surface-variant font-label-caps text-label-caps uppercase hover:border-secondary hover:text-secondary transition-all duration-300">
                        Restart
                    </button>
</div>
</div>
</div>
</main>
<!-- Footer -->
<footer class="fixed bottom-0 left-0 w-full z-30 flex justify-between items-center px-margin-mobile py-2 pointer-events-none bg-transparent font-label-caps text-label-caps md:pl-[calc(16rem+40px)]">
<div class="text-on-surface">© 2024 PULSERAIL_OS // VER 2.0.4</div>
<div class="flex gap-4">
<span class="text-on-surface-variant/50 hover:text-primary transition-colors cursor-pointer pointer-events-auto hover:underline">[P] PAUSE</span>
<span class="text-on-surface-variant/50 hover:text-primary transition-colors cursor-pointer pointer-events-auto">[R] RESET</span>
<span class="text-on-surface-variant/50 hover:text-primary transition-colors cursor-pointer pointer-events-auto">[M] MUTE</span>
</div>
</footer>
</body></html>
